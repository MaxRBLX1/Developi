[package]
name = "developi"
version = "0.1.0"
edition = "2021"
description = "The workshop for inventors. Drag and drop."

[dependencies]
egui = "0.27"
eframe = "0.27"
pyo3 = { version = "0.25.0", features = ["auto-initialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
rodio = "0.18"
log = "0.4"
env_logger = "0.11"
chrono = "0.4.44"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
debug-assertions = true

[profile.release]
opt-level = 2
strip = false
lto = false
debug = true
