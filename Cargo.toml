[package]
name = "developi"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = "0.27"
eframe = "0.27"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
pyo3 = { version = "0.23", features = ["auto-initialize"] }
rodio = "0.17"
open = "5.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["psapi", "processthreadsapi", "minwindef"] }